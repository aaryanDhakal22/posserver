version: "2"
sql:
  - engine: "postgresql"
    queries: "query.sql"
    schema: "schema.sql"
    gen:
      go:
        package: "models"
        out: "../internal/infra/database/models/"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_json_tags: true
        emit_prepared_queries: true
        # Preserve the IP initialism the repos are written against (sqlc would
        # otherwise emit the field as `Ip`).
        rename:
          ip: "IP"
          old_ip: "OldIP"
          new_ip: "NewIP"
          mac: "MAC"
