name: quicc-staging

services:
  postgres:
    image: postgres:16-alpine
    container_name: quicc-staging-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - quicc_staging_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - internal

  api:
    container_name: quicc-staging-api
    image: ghcr.io/aaryandhakal22/posserver:${STAGING_TAG:-staging-latest}
    environment:
      APP_ENV: staging
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_NAME: ${DB_NAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SERVER_PORT: 1323
      LOG_LEVEL: debug
      LOG_OUTPUT: standard
      LOG_STYLE: json
      TZ: America/New_York
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      SQS_QUEUE_URL: ${SQS_QUEUE_URL}
      SQS_ENDPOINT: ${SQS_ENDPOINT:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      # Handed to a freshly linked agent (Pi set up / replaced) + main's own pages.
      AGENT_SECRET_PUSHOVER_APP_TOKEN: ${AGENT_SECRET_PUSHOVER_APP_TOKEN:-}
      AGENT_SECRET_PUSHOVER_USER_KEY: ${AGENT_SECRET_PUSHOVER_USER_KEY:-}
      AGENT_SECRET_PUSHOVER_BOSS_KEY: ${AGENT_SECRET_PUSHOVER_BOSS_KEY:-}
      AGENT_SECRET_OTLP_ENDPOINT: ${AGENT_SECRET_OTLP_ENDPOINT:-}
      AGENT_SECRET_OTLP_HEADERS: ${AGENT_SECRET_OTLP_HEADERS:-}
      AGENT_SECRET_TAILSCALE_AUTHKEY: ${AGENT_SECRET_TAILSCALE_AUTHKEY:-}
      # Maps (2.0.9): GEO_OSRM_URL=http://osrm:5000 reaches the `osrm` container,
      # which joins this compose's `internal` network (quicc-staging_internal; see
      # quicc-ops deploy/osrm). GEO_CONTACT = Nominatim's contact; Google is
      # optional (a key switches geocoding + routing); the URL overrides are for tests.
      GEO_OSRM_URL: ${GEO_OSRM_URL:-}
      GEO_CONTACT: ${GEO_CONTACT:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      GEO_CENSUS_URL: ${GEO_CENSUS_URL:-}
      GEO_NOMINATIM_URL: ${GEO_NOMINATIM_URL:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - proxy
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.quicc-staging.rule=Host(`staging.quiccpos.com`)"
      - "traefik.http.routers.quicc-staging.entrypoints=websecure"
      - "traefik.http.routers.quicc-staging.tls=true"
      - "traefik.http.routers.quicc-staging.tls.certresolver=cloudflare"
      - "traefik.http.services.quicc-staging.loadbalancer.server.port=1323"

networks:
  proxy:
    external: true
  internal:

volumes:
  quicc_staging_postgres:
    name: quicc_staging_postgres
