version: "3"

# main/ Taskfile — every secret-bearing task is wrapped in `DOPPLER_TOKEN=$(cat {{.DOPPLER_TOKEN_FILE}}) doppler run --`,
# which injects DOPPLER_TOKEN from the gitignored {{.DOPPLER_TOKEN_FILE}}
# (a dev service token) and runs `DOPPLER_TOKEN=$(cat {{.DOPPLER_TOKEN_FILE}}) doppler run --`. No `doppler login` /
# `doppler setup` needed — same pattern as online/ and agent/. If a task
# fails on secrets, check that .doppler-dev-main exists and is valid.
#
# Default invocation (`task`) prints this list.

vars:
  # Dev secrets come from a gitignored service-token file (no doppler login).
  DOPPLER_TOKEN_FILE: .doppler-dev-main
  COMPOSE: "docker compose -f ./docker/docker-compose.dev.yml"
  MIGRATIONS_DIR: backend/internal/migrate/sql

tasks:
  default:
    desc: List all tasks
    silent: true
    cmds:
      - task --list

  # ──────────────────────────────────────────────────────────────────────
  # Dev stack lifecycle
  # ──────────────────────────────────────────────────────────────────────

  devup:
    desc: Start the dev stack (foreground)
    cmds:
      - DOPPLER_TOKEN=$(cat {{.DOPPLER_TOKEN_FILE}}) doppler run -- {{.COMPOSE}} up

  devupd:
    desc: Start the dev stack (detached)
    cmds:
      - DOPPLER_TOKEN=$(cat {{.DOPPLER_TOKEN_FILE}}) doppler run -- {{.COMPOSE}} up -d

  devdown:
    desc: Stop the dev stack
    cmds:
      - DOPPLER_TOKEN=$(cat {{.DOPPLER_TOKEN_FILE}}) doppler run -- {{.COMPOSE}} down

  devrestart:
    desc: Restart the dev stack
    cmds:
      - DOPPLER_TOKEN=$(cat {{.DOPPLER_TOKEN_FILE}}) doppler run -- {{.COMPOSE}} down
      - DOPPLER_TOKEN=$(cat {{.DOPPLER_TOKEN_FILE}}) doppler run -- {{.COMPOSE}} up

  devreset:
    desc: Wipe images + rebuild from scratch (keeps volumes)
    cmds:
      - DOPPLER_TOKEN=$(cat {{.DOPPLER_TOKEN_FILE}}) doppler run -- {{.COMPOSE}} down
      - DOPPLER_TOKEN=$(cat {{.DOPPLER_TOKEN_FILE}}) doppler run -- {{.COMPOSE}} down --rmi all
      - DOPPLER_TOKEN=$(cat {{.DOPPLER_TOKEN_FILE}}) doppler run -- {{.COMPOSE}} up --build

  dev-status:
    aliases: [ps]
    desc: Show running dev services
    cmds:
      - DOPPLER_TOKEN=$(cat {{.DOPPLER_TOKEN_FILE}}) doppler run -- {{.COMPOSE}} ps

  dev-recreate-api:
    desc: Rebuild + restart only the api container
    cmds:
      - DOPPLER_TOKEN=$(cat {{.DOPPLER_TOKEN_FILE}}) doppler run -- {{.COMPOSE}} build api
      - DOPPLER_TOKEN=$(cat {{.DOPPLER_TOKEN_FILE}}) doppler run -- {{.COMPOSE}} up -d --force-recreate api

  # ──────────────────────────────────────────────────────────────────────
  # Per-service utilities
  # ──────────────────────────────────────────────────────────────────────

  dev-logs:
    desc: "Tail logs for one or more services: task dev-logs -- api"
    cmds:
      - DOPPLER_TOKEN=$(cat {{.DOPPLER_TOKEN_FILE}}) doppler run -- {{.COMPOSE}} logs -f --tail=200 {{.CLI_ARGS}}

  dev-shell:
    desc: "Exec a shell into a service: task dev-shell -- api"
    interactive: true
    cmds:
      - DOPPLER_TOKEN=$(cat {{.DOPPLER_TOKEN_FILE}}) doppler run -- {{.COMPOSE}} exec {{.CLI_ARGS}} sh

  dev-psql:
    aliases: [psql]
    desc: Open psql against the dev postgres
    interactive: true
    cmds:
      - DOPPLER_TOKEN=$(cat {{.DOPPLER_TOKEN_FILE}}) doppler run -- bash -c '{{.COMPOSE}} exec -e PGPASSWORD=$DB_PASSWORD postgres psql -U $DB_USER -d $DB_NAME'

  # ──────────────────────────────────────────────────────────────────────
  # Database — volumes vs schema wipe
  # ──────────────────────────────────────────────────────────────────────

  dev-del-volumes:
    desc: Stop the stack AND delete all volumes (full Postgres wipe)
    prompt: This destroys the postgres + pgadmin volumes. Continue?
    cmds:
      - DOPPLER_TOKEN=$(cat {{.DOPPLER_TOKEN_FILE}}) doppler run -- {{.COMPOSE}} down -v

  db-wipe:
    desc: Drop + recreate the public schema (re-runs migrations on next start)
    prompt: This drops every table in the dev DB. Continue?
    cmds:
      - DOPPLER_TOKEN=$(cat {{.DOPPLER_TOKEN_FILE}}) doppler run -- bash -c '{{.COMPOSE}} exec -e PGPASSWORD=$DB_PASSWORD postgres psql -U $DB_USER -d $DB_NAME -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"'
      - 'echo "Schema wiped. Restart the api container with task dev-recreate-api to re-run migrations."'

  db-dump:
    desc: pg_dump the dev DB to ./dumps/dev-<unix>.sql
    cmds:
      - mkdir -p ./dumps
      - DOPPLER_TOKEN=$(cat {{.DOPPLER_TOKEN_FILE}}) doppler run -- bash -c '{{.COMPOSE}} exec -T -e PGPASSWORD=$DB_PASSWORD postgres pg_dump -U $DB_USER -d $DB_NAME > ./dumps/dev-$(date +%s).sql'
      - echo "Dump written to ./dumps/"

  db-restore:
    desc: "Restore a SQL dump into the dev DB: task db-restore -- ./dumps/dev-<unix>.sql"
    prompt: This overwrites the current dev DB content. Continue?
    cmds:
      - DOPPLER_TOKEN=$(cat {{.DOPPLER_TOKEN_FILE}}) doppler run -- bash -c '{{.COMPOSE}} exec -T -e PGPASSWORD=$DB_PASSWORD postgres psql -U $DB_USER -d $DB_NAME < {{.CLI_ARGS}}'

  # ──────────────────────────────────────────────────────────────────────
  # Migrations (goose, against local Postgres)
  # ──────────────────────────────────────────────────────────────────────

  migrate-up:
    aliases: [devmigrate]
    desc: Apply all pending migrations
    cmds:
      - DOPPLER_TOKEN=$(cat {{.DOPPLER_TOKEN_FILE}}) doppler run -- bash -c 'goose -dir {{.MIGRATIONS_DIR}} postgres "host=localhost port=$DB_PORT user=$DB_USER password=$DB_PASSWORD dbname=$DB_NAME sslmode=disable" up'

  migrate-down:
    desc: Roll back the most recent migration
    prompt: Rolling back the latest migration may drop data. Continue?
    cmds:
      - DOPPLER_TOKEN=$(cat {{.DOPPLER_TOKEN_FILE}}) doppler run -- bash -c 'goose -dir {{.MIGRATIONS_DIR}} postgres "host=localhost port=$DB_PORT user=$DB_USER password=$DB_PASSWORD dbname=$DB_NAME sslmode=disable" down'

  migrate-status:
    desc: Show applied vs pending migrations
    cmds:
      - DOPPLER_TOKEN=$(cat {{.DOPPLER_TOKEN_FILE}}) doppler run -- bash -c 'goose -dir {{.MIGRATIONS_DIR}} postgres "host=localhost port=$DB_PORT user=$DB_USER password=$DB_PASSWORD dbname=$DB_NAME sslmode=disable" status'

  migrate-create:
    desc: "Scaffold a new SQL migration: task migrate-create -- name_in_snake_case"
    cmds:
      - goose -dir {{.MIGRATIONS_DIR}} -s create {{.CLI_ARGS}} sql

  # ──────────────────────────────────────────────────────────────────────
  # sqlc
  # ──────────────────────────────────────────────────────────────────────

  sqlc-gen:
    aliases: [sqlc]
    desc: Regenerate sqlc models inside the dev api container
    cmds:
      - DOPPLER_TOKEN=$(cat {{.DOPPLER_TOKEN_FILE}}) doppler run -- {{.COMPOSE}} exec api sh -c "cd /src && sqlc generate -f sql/sqlc.yaml"

  # ──────────────────────────────────────────────────────────────────────
  # Frontend (SvelteKit → embedded into the Go binary)
  # ──────────────────────────────────────────────────────────────────────

  ui-dev:
    desc: Vite dev server with HMR (proxies /api,/admin/v1,/store/v1 → :1323). Needs `task devup` running.
    dir: backend/frontend
    cmds:
      - npm run dev

  ui-check:
    desc: Type-check + lint the SvelteKit app (svelte-check), and run the TS pricing engine over the shared cases (Node ≥ 23)
    dir: backend/frontend
    cmds:
      - npm run check
      - node --test "tests/*.test.mjs"

  ui-build:
    desc: Build the SvelteKit app and copy it into the Go embed dir
    dir: backend/frontend
    cmds:
      - npm run build
      # Clear the embed dir (keep the tracked placeholders), then drop in the build.
      - find ../internal/transport/webapp/build -mindepth 1 ! -name .gitkeep ! -name .gitignore -exec rm -rf {} +
      - cp -r build/. ../internal/transport/webapp/build/

  # ──────────────────────────────────────────────────────────────────────
  # Admin / tenancy helpers (require ADMIN_API_KEY in Doppler)
  # ──────────────────────────────────────────────────────────────────────

  admin-key-gen:
    desc: Print a freshly generated random key (does NOT persist — set it in Doppler yourself)
    silent: true
    cmds:
      - 'echo "Generated key (copy into Doppler as ADMIN_API_KEY):"'
      - openssl rand -hex 32

  # ──────────────────────────────────────────────────────────────────────
  # Tests
  # ──────────────────────────────────────────────────────────────────────

  # 4 xdist workers; `--dist loadgroup` keeps each xdist_group on one worker
  # ("geo": tests that swap main's global geo providers, "dlq": the DLQ walk).
  # Extra pytest args pass through: task test -- -n 0 -k routing
  test:
    desc: Run the main/ pytest suite (dev stack must be up)
    cmds:
      - DOPPLER_TOKEN=$(cat {{.DOPPLER_TOKEN_FILE}}) doppler run -- uv run --directory tests pytest -v -n ${MAIN_PYTEST_WORKERS:-4} --dist loadgroup {{.CLI_ARGS}}

  test-quick:
    desc: Fast subset of main/ tests
    cmds:
      - DOPPLER_TOKEN=$(cat {{.DOPPLER_TOKEN_FILE}}) doppler run -- uv run --directory tests pytest -v -n 4 --dist loadgroup -m "not slow" {{.CLI_ARGS}}

  test-unit:
    desc: Go unit tests (no Postgres, no Doppler needed)
    dir: backend
    cmds:
      - go test ./...

  test-migrate:
    desc: "Schema tests on a throwaway Postgres 16 (Docker, random port, removed after): baseline = old chain + hardening, schema.sql, adoption, audit log + roles, indexes used, dump/restore"
    dir: backend
    cmds:
      - |
        set -eu
        name=quicc-migrate-test-$$
        docker run -d --rm --name "$name" --health-cmd "pg_isready -U quicc_owner -d t1" --health-interval 1s \
          -e POSTGRES_USER=quicc_owner -e POSTGRES_PASSWORD=pw -e POSTGRES_DB=t1 -p 127.0.0.1::5432 postgres:16-alpine > /dev/null
        trap 'docker stop "$name" > /dev/null 2>&1 || true' EXIT
        for i in $(seq 60); do [ "$(docker inspect -f '{{"{{"}}.State.Health.Status{{"}}"}}' "$name")" = healthy ] && break; sleep 1; done
        docker exec "$name" createdb -U quicc_owner t2
        port=$(docker port "$name" 5432/tcp | head -1 | sed 's/.*://')
        QUICC_TEST_PG_DSN="postgres://quicc_owner:pw@127.0.0.1:$port/t1?sslmode=disable" \
        QUICC_TEST_PG_RESTORE_DSN="postgres://quicc_owner:pw@127.0.0.1:$port/t2?sslmode=disable" \
        QUICC_TEST_PG_TOOLS="docker run --rm -i --network host postgres:16-alpine" \
        go test -count=1 -p 1 ./internal/migrate/ ./internal/infra/database/auditconn/
