name: Build and Push to GHCR

# ─────────────────────────────────────────────────────────────────────────
# main/ CI.
#
# Image tags at ghcr.io/<owner>/posserver (floating tags move, the rest don't):
#
#   push to `staging` branch → staging-latest (floating), staging-<sha7>
#   push to `master`         → prod-latest (floating),    prod-<sha7>
#   push a `v*` tag          → <semver>, prod-v<semver>   (immutable release)
#   any other branch         → branch-<slug>
#
# Staging and prod images live side by side. Nothing here deploys: a host
# only changes when an operator pulls a tag and recreates the container
# (`task deploy IMAGE=…` on the prod box, `task staging-up` on staging).
# NOTE: `master` still holds v1 until the cutover (see ../CUTOVER.md) — push v2
# to `staging` only.
# ─────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: ["**"]
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/posserver

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # 0. Verify — go vet + go test before any image is built.
  #    Lighter than online's (no full compose stack); the project-level
  #    pytest suite at tests/ exercises main+online+agent together when
  #    you run it locally with `task test-e2e`.
  # ──────────────────────────────────────────────────────────────────────
  verify:
    name: Verify (go vet + go test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: go vet
        working-directory: ./backend
        run: go vet ./...

      - name: go test
        working-directory: ./backend
        run: go test ./...

  # ──────────────────────────────────────────────────────────────────────
  # Staging — every branch push (gated on verify)
  # ──────────────────────────────────────────────────────────────────────
  build-staging:
    name: Build branch image
    needs: verify
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute staging tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=staging-latest,enable=${{ github.ref == 'refs/heads/staging' }}
            type=sha,prefix=staging-,format=short,enable=${{ github.ref == 'refs/heads/staging' }}
            type=raw,value=prod-latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,prefix=prod-,format=short,enable=${{ github.ref == 'refs/heads/master' }}
            type=ref,event=branch,prefix=branch-,enable=${{ github.ref != 'refs/heads/staging' && github.ref != 'refs/heads/master' }}

      - name: Read VERSION
        id: version
        run: echo "value=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push staging image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.staging
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=staging
          cache-to: type=gha,mode=max,scope=staging

  # ──────────────────────────────────────────────────────────────────────
  # Production — semver tag push only (gated on verify)
  # ──────────────────────────────────────────────────────────────────────
  build-production:
    name: Build production image
    needs: verify
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute production tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=prod-v{{version}}

      - name: Read VERSION
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push production image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.production
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=production
          cache-to: type=gha,mode=max,scope=production

      # Deploy is operator-driven by design — main/'s blue-green needs an
      # explicit `task deploy IMAGE=...` on the home-prod box. Don't add
      # auto-deploy here unless that policy changes.
