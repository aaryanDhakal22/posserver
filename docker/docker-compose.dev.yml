services:
  postgres:
    image: postgres:16-alpine
    container_name: quicc-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    container_name: quicc-api
    build:
      context: ../backend
      target: dev
    environment:
      APP_ENV: dev
      DB_HOST:
      DB_PORT:
      DB_USER:
      DB_NAME:
      SERVER_PORT:
      LOG_LEVEL:
      LOG_OUTPUT:
      LOG_STYLE:
      DB_PASSWORD:
      AWS_REGION:
      AWS_ACCESS_KEY_ID:
      AWS_SECRET_ACCESS_KEY:
      SQS_QUEUE_URL:
      SQS_ENDPOINT:
      # Required: gates /admin/v1/* and the embedded /admin UI's mutations.
      # Generate one with `task admin-key-gen` and put it in Doppler.
      ADMIN_API_KEY:
      AGENT_SECRET_PUSHOVER_APP_TOKEN:
      AGENT_SECRET_PUSHOVER_USER_KEY:
      AGENT_SECRET_PUSHOVER_BOSS_KEY:
      AGENT_SECRET_OTLP_ENDPOINT:
      AGENT_SECRET_OTLP_HEADERS:
      AGENT_SECRET_TAILSCALE_AUTHKEY:
      # Maps (2.0.9). Empty GEO_OSRM_URL = routing off (orders still geocoded).
      GEO_OSRM_URL:
      GEO_CONTACT:
      GOOGLE_MAPS_API_KEY:
      GEO_CENSUS_URL:
      GEO_NOMINATIM_URL:
      ORDER_REDELIVER_AFTER:
      OTEL_EXPORTER_OTLP_ENDPOINT:
      OTEL_EXPORTER_OTLP_HEADERS:
      OTEL_SERVICE_NAME:
      TZ: America/New_York
    restart: unless-stopped
    # pytest runs a fake geo server on the host and points main at it through
    # the dev-only POST /admin/v1/geo/test-providers (tests/test_geo.py).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../backend:/src
      - ~/.aws:/root/.aws:ro
    ports:
      # Host bind port is sourced from Doppler (DEV_HOST_PORT) so all modules
      # coexist on one dev box without conflict. Container stays on 1323.
      - "${DEV_HOST_PORT:-1323}:1323"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:1323/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s

  elasticmq:
    image: softwaremill/elasticmq-native:latest
    container_name: quicc-local-sqs
    volumes:
      - ./elasticmq.conf:/opt/elasticmq.conf
    ports:
      # REST API port 
      - "9324:9324"
    restart: unless-stopped

  elasticmq-ui:
    image: softwaremill/elasticmq-ui:latest
    container_name: quicc-local-sqs-ui
    ports:
      # Web UI port
      - "3000:3000"
    restart: unless-stopped
    environment:
      SQS_ENDPOINT: http://elasticmq:9324
    depends_on:
      - elasticmq

  pgadmin:
    image: dpage/pgadmin4
    container_name: quicc-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: 
      PGADMIN_DEFAULT_PASSWORD:
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
