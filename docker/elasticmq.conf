# elasticmq.conf
# quiccpos/elasticmq.conf
include classpath("application.conf")

node-address {
    protocol = http
    host = "*"
    port = 9324
    context-path = ""
}
rest-sqs {
    enabled = true
    bind-port = 9324
    bind-hostname = "0.0.0.0"
    sqs-limits = strict
}

queues {
    dev-ingest {
        # Short on dev so an unprocessed message comes back fast (the DLQ
        # redrive test takes ~15 s, not ~90 s). Safe: main's consumer sets no
        # VisibilityTimeout of its own and a redelivered order is a no-op
        # (UNIQUE (tenant_id, source, source_event_id) → ErrDuplicate → delete).
        defaultVisibilityTimeout = 5 seconds
        receiveMessageWait = 5 seconds
        fifo = false
        # Mirror AWS redrive: a message main can't process (unroutable store,
        # bad payload) moves to the DLQ after 3 receives instead of cycling
        # every visibility timeout forever.
        deadLettersQueue {
            name = "dev-ingest-dlq"
            maxReceiveCount = 3
        }
    }
    dev-ingest-dlq {
        defaultVisibilityTimeout = 30 seconds
    }
    # add whatever quiccpos queues you have
}
